<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Getaway — GTA 6 Cover Art Maker</title>
<link rel="stylesheet" href="./style.css">
<style>@font-face { font-family: 'Anton'; src: url('./fonts/Anton.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }</style>
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>GOLDEN GETAWAY</h1>
    <p class="sub">Turn your crew into a sunset movie-poster cast. Pick a panel, drop in a photo, drag to frame it, export the cover.</p>
    <label>Your photos <input id="upload" type="file" accept="image/*" multiple></label>
    <div class="label">Photo library — click to put in the selected panel</div>
    <div id="thumbs" class="thumbs"></div>
    <div class="label">Cast panels — click to select</div>
    <div id="panels" class="panels"></div>
    <label>Role of selected panel <input id="role" type="text" maxlength="24" value="THE WHEELMAN"></label>
    <label>Zoom <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1"></label>
    <button id="fillAll" type="button" class="ghost">Fill all 7 panels with this photo</button>
    <label>Title <input id="title" type="text" maxlength="30" value="GOLDEN GETAWAY"></label>
    <label>Subtitle <input id="subtitle" type="text" maxlength="40" value="one last summer job"></label>
    <label>Pull-quote <input id="quote" type="text" maxlength="48" value="A JOYRIDE WORTH EVERY TICKET"></label>
    <label>Gazette <input id="gazette" type="text" maxlength="24" value="THE SUNSET HERALD"></label>
    <label>Tagline <input id="tagline" type="text" maxlength="60" value="SEVEN CREW • ONE SUNSET • NO WAY BACK"></label>
    <label>Credits line <input id="credits" type="text" maxlength="120" value="SUNSET PICTURES  •  A GOLDEN GETAWAY FILM  •  STARRING YOU AND YOUR CREW  •  IN THEATRES THIS SUMMER"></label>
    <div class="label">Export PNG</div>
    <div class="exports">
      <button type="button" data-export="1920x1080">1920 × 1080</button>
      <button type="button" data-export="1080x1080">1080 × 1080</button>
      <button type="button" data-export="1080x1350">1080 × 1350</button>
    </div>
    <p id="status" role="status">Drag any panel to reframe its photo.</p>
  </section>
  <canvas id="cover" width="1280" height="720" aria-label="Golden Getaway cover preview"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
